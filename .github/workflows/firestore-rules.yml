name: Firestore 규칙 자동 반영
on:
  push:
    branches: [main]
    paths: [firestore.rules, .github/deploy-rules.js, .github/workflows/firestore-rules.yml]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node .github/deploy-rules.js
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
