<title>바로도구함 · 도구로 이동 | 제작 최은영</title>
<style>
:root{--ink:#0f1a24;--sub:#5b6875;--mint:#0e9f76;--line:#dfe6ec;--bg:#f4f7f9;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef3;--sub:#9fb0bd;--line:#2a3640;--bg:#10171d;--card:#17212a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
font-family:"Pretendard","맑은 고딕","Malgun Gothic",-apple-system,sans-serif}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px 22px;text-align:center;box-shadow:0 18px 40px -24px rgba(15,26,36,.35)}
.logo{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;font-weight:900;font-size:19px}
.brand{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--mint);letter-spacing:.02em}
h1{margin:14px 0 6px;font-size:21px;font-weight:900;letter-spacing:-.03em;word-break:keep-all}
#msg{margin:0;font-size:14px;color:var(--sub);line-height:1.6;word-break:keep-all}
.spin[hidden]{display:none}
.spin{width:26px;height:26px;margin:18px auto 4px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#go{display:inline-block;margin-top:16px;padding:11px 20px;border-radius:12px;background:var(--mint);color:#fff;font-weight:800;font-size:14.5px;text-decoration:none}
.foot{margin:20px 0 0;font-size:11.5px;color:var(--sub)}
</style>
</head>
<body>
<main class="box">
<span class="logo" aria-hidden="true">바</span>
<p class="brand">바로도구함</p>
